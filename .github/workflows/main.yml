
name: JARVIS ZERO Windows Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Get JARVIS source code
        uses: actions/checkout@v4

      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Compile JARVIS
        run: dotnet publish JarvisZero.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish

      - name: Create ZIP
        run: Compress-Archive -Path publish\* -DestinationPath JARVIS-ZERO.zip

      - name: Upload JARVIS
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-ZERO-Windows
          path: JARVIS-ZERO.zip
